<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Draw on Screen Red Mode</title>
	<style>
	 body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #311; font-family: sans-serif; color: #fff; }
	 .container { position: relative; width: 640px; height: 480px; }
	 video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 8px; }
	 canvas { transform: scaleX(-1); }
	 video { transform: scaleX(-1); display: none; }
	</style>
</head>
<body>

	<div class="container">
	 <video id="camera" autoplay playsinline></video>
	 <canvas id="canvas"></canvas>
	</div>

	<script type="module>
	 import { HandLandmarker, FilesetResolver } from "https://unpkg.com";
	 

	 const video = document.getElementById("camera");
	 const canvas = document.getElementById("canvas");
	 const context = canvas.getContext("2d");
	 let handLandmarker = undefined;
	 let lastFrame = -1;

	 const fingertips = [4, 8, 12, 16, 20];

	 async function initHandTracking() 
	 {
	  try 
	  { 
	   const visionFiles = await FilesetResolver.forVisionTasks("https://unpkg.com/wasm");
	   handLandmarker = await HandLandmarker.createFromOptions(visionFiles, { baseOptions: { modelAssetPath: "https://googleapis.com", delegate: "GPU" }, runningMode: "VIDEO", numHands: 2 });
	   startCamera();
	  } catch (error) { alert("MediaPipe setup failed."); }
	 }

	 function startCamera() 
	 {
	  navigator.mediaDevices.getUserMedia({ video: {width: 640, height: 480 } })
	   .then((stream) => {
	    video.srcObject = stream;
	    video.addEventListener("loadeddata", cameraLoop);
	   })
	   .catch((err) => {console.error("Camera access denied:", err);});
	 }

	 async function cameraLoop() 
	 {
	  if (canvas.width !== video.videoWidth) { 
	   canvas.width = video.videoWidth;
	   canvas.height = video.videoHeight;
	  }
	  if (video.currentTime !== lastFrame) { 
	   lastFrame = video.currentTime;
	   const startTimeMs = performance.now();
	   const results = handLandmarker.detectForVideo(video, startTimeMs);

	   context.clearRect(0, 0, canvas.width, canvas.height);
	   context.drawImage(video, 0, 0, canvas.width, canvas.height);

	   if (results.landmarks)
	   {
	    for (const fingers of results.landmarks)
	    {
	     fingertips.forEach((index) => 
	     { 
	      const fingertip = fingers[index];
	      const x = fingertip.x * canvas.width;
	      const y = fingertip.y * canvas.height;

	      context.beginPath();
	      context.arc(x, y, 8, 0, 2*Math.PI);
	      context.fillStyle="#00FF00";
	      context.fill();
	      context.strokeStyle="#FFFFFF";
	      context.lineWidth = 2;
	      context.stroke();
	     });
	    }
	   }
	  }
	  requestAnimationFrame(cameraLoop);
	 }
	 initHandTracking();
	</script>
</body>
</html>
